publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.1
  cached_network_image: ^3.3.1
  readmore: ^3.0.0

  # ✅ MUST be here
  equatable: ^2.0.5
  url_launcher: ^6.3.0
  flutter_bloc: ^8.1.6
  get_it: ^7.7.0
  webview_flutter: ^4.7.0
  webview_flutter_android: ^4.4.0
  webview_flutter_wkwebview: ^3.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/images/
